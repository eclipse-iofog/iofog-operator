name: CI

on:
  push:
    branches:
      - develop
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - LICENSE
      - '**/*.md'
      - .cursor/**
  pull_request:
    branches:
      - main
      - develop
      - release/**
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - LICENSE
      - '**/*.md'
      - .cursor/**
  workflow_dispatch:

permissions: read-all

env:
  GO_VERSION: '1.26.5'
  VERSION_TAG: ci-${{ github.run_id }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - run: go version

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.12.2
          args: --timeout=5m0s --config .golangci.yaml

      - name: Static security analysis
        run: make security-code

      - name: CRD drift gate
        run: make gen-check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - run: go version

      - name: Run unit tests
        run: go test ./... -count=1

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/set-build-env
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          OPERATOR_CRD_GROUP: ${{ vars.OPERATOR_CRD_GROUP }}
          HELM_REPO_BASE_URL: ${{ vars.HELM_REPO_BASE_URL }}
          OCI_SOURCE_REPO: ${{ vars.OCI_SOURCE_REPO }}
          OPERATOR_COMPONENT_LABEL_DOMAIN: ${{ vars.OPERATOR_COMPONENT_LABEL_DOMAIN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build operator image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_REGISTRY }}/operator:${{ env.VERSION_TAG }}
          build-args: |
            IMAGE_REGISTRY=${{ env.IMAGE_REGISTRY }}
            OPERATOR_COMPONENT_LABEL_DOMAIN=${{ env.OPERATOR_COMPONENT_LABEL_DOMAIN }}
            OCI_SOURCE_REPO=${{ env.OCI_SOURCE_REPO }}

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        flavor: [datasance, iofog]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - name: Lint chart (${{ matrix.flavor }})
        env:
          VERSION_TAG: ${{ env.VERSION_TAG }}
        run: |
          case "${{ matrix.flavor }}" in
            datasance)
              export IMAGE_REGISTRY=ghcr.io/datasance
              export OPERATOR_CRD_GROUP=datasance.com
              ;;
            iofog)
              export IMAGE_REGISTRY=ghcr.io/eclipse-iofog
              export OPERATOR_CRD_GROUP=iofog.org
              ;;
          esac
          chmod +x hack/package-helm.sh
          LINT_ONLY=1 hack/package-helm.sh "${{ matrix.flavor }}" "${VERSION_TAG}"

      - name: Render gh-pages docs (${{ matrix.flavor }})
        env:
          VERSION_TAG: ${{ env.VERSION_TAG }}
        run: |
          case "${{ matrix.flavor }}" in
            datasance)
              export IMAGE_REGISTRY=ghcr.io/datasance
              export OPERATOR_CRD_GROUP=datasance.com
              export HELM_REPO_BASE_URL=https://datasance.github.io/iofog-operator
              export OCI_SOURCE_REPO=https://github.com/Datasance/iofog-operator
              EXPECT_GROUP=datasance.com
              ;;
            iofog)
              export IMAGE_REGISTRY=ghcr.io/eclipse-iofog
              export OPERATOR_CRD_GROUP=iofog.org
              export HELM_REPO_BASE_URL=https://eclipse-iofog.github.io/iofog-operator
              export OCI_SOURCE_REPO=https://github.com/eclipse-iofog/iofog-operator
              EXPECT_GROUP=iofog.org
              ;;
          esac
          OUT="$(mktemp -d)"
          chmod +x hack/render-helm-docs.sh
          hack/render-helm-docs.sh "${{ matrix.flavor }}" "${VERSION_TAG}" "${OUT}"
          grep -q "controlplanes.${EXPECT_GROUP}" "${OUT}/index.html"
          grep -q "${HELM_REPO_BASE_URL}" "${OUT}/index.html"
          test -f "${OUT}/.nojekyll"
