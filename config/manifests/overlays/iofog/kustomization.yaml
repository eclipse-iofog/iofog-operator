# Flavor overlay for OLM bundle generation (iofog.org CRD group).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../bases/iofog-operator.clusterserviceversion.yaml
- ../../../operator
- ../../../crd/bases/iofog.org_controlplanes.yaml
- ../../../cr
- ../../../rbac

patches:
- target:
    kind: ControlPlane
    name: iofog
  patch: |-
    - op: replace
      path: /apiVersion
      value: iofog.org/v3
