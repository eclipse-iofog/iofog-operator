apiVersion: datasance.com/v3
kind: ControlPlane
metadata:
  name: pot
spec:
  replicas:
    controller: 2
    nats: 2  # NATS server replicas (min 2 when NATS enabled)
  database:
    provider: postgres
    user:
    host:
    port:
    password:
    databaseName:
    ssl:
    ca:
  auth:
    mode: embedded  # embedded | external
    insecureAllowHttp: false
    insecureAllowBootstrapLog: false
    bootstrap:
      username: admin
      password:  # inline password or use passwordSecretRef
      # passwordSecretRef:
      #   name: controller-bootstrap
      #   key: password
    # External-only (when mode=external):
    # issuerUrl: https://idp.example.com/realms/myrealm
    # client:
    #   id: controller-api
    #   secret: ""
    # Embedded-only optional tuning:
    # consoleClient: edgeops-console
    # consoleClientEnabled: true
    # rateLimit:
    #   enabled: true
    #   maxRequestsPerWindow: 100
    #   windowMs: 60000
    # sessionStore:
    #   type: memory
    #   ttlMs: 86400000
    # tokenTtl:
    #   accessTokenTtlSeconds: 3600
    #   refreshTokenTtlSeconds: 86400
    # oidcTtl:
    #   interactionTtlSeconds: 3600
    #   grantTtlSeconds: 3600
    #   sessionTtlSeconds: 86400
    #   idTokenTtlSeconds: 3600
  events:
    auditEnabled:
    retentionDays:
    cleanupInterval:
    captureIpAddress:
  images:
    pullSecret:
    controller:
    router:
    nats: ghcr.io/datasance/nats:2.12.4  # NATS server image (optional)
  services:
    controller:
      type:  # LoadBalancer / ClusterIP / NodePort; use Ingress when ClusterIP
      annotations:  # LoadBalancer IP pool annotations, e.g. Azure internal LB
        #service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    router:
      type:
      annotations:
        #service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    nats:
      type: ClusterIP  # or LoadBalancer when using external NATS clients
      annotations: {}
    natsServer:  # nats-server service (client + monitor ports, non-TLS)
      type: ClusterIP
      annotations: {}
  nats:  # optional; when omitted NATS is enabled with defaults
    enabled: true  # set to false to disable NATS and not register a hub
    jetStream:
      storageSize: "10Gi"  # PVC and max_file_store
      memoryStoreSize: "1Gi"  # max_memory_store
      storageClassName: ""
  controller:
    publicUrl:  # required; e.g. https://controller.example.com
    trustProxy: false
    consoleUrl:
    consolePort: 0
    pidBaseDir: ""
    https: false
    secretName:  # TLS secret when https=true; match controller ingress secretName
    logLevel:
  ingresses:
    controller:
      annotations:
        # cert-manager.io/cluster-issuer: letsencrypt
        # nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
        # nginx.ingress.kubernetes.io/backend-protocol: "https"
      ingressClassName:
      host:
      secretName:
    router:
      address:
      messagePort: 5671
      interiorPort: 55671
      edgePort: 45671
    nats:  # required when using ingress for NATS (address = hostname)
      address:
      serverPort: 4222
      clusterPort: 6222
      leafPort: 7422
      mqttPort: 8883
      httpPort: 8222
status:
  conditions:
    - lastTransitionTime: "2022-04-10T22:44:09Z"
      message: ""
      reason: "initial_status"
      status: "True"
      type: "deploying"
