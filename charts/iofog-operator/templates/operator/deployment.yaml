apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iofog-operator.fullname" . }}
  labels:
    {{- include "iofog-operator.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "iofog-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "iofog-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "iofog-operator.serviceAccountName" . }}
      {{- with .Values.images.pullSecret }}
      imagePullSecrets:
        - name: {{ . | quote }}
      {{- end }}
      containers:
        - name: iofog-operator
          command:
            - iofog-operator
          args:
            - --enable-leader-election
          image: {{ include "iofog-operator.operatorImage" . | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: OPERATOR_NAME
              value: {{ include "iofog-operator.fullname" . }}
      terminationGracePeriodSeconds: 10
