{{- $controller := .Values.controller | default dict -}}
{{- $tls := $controller.tls | default dict -}}
{{- if and $controller.https (eq ($tls.source | default "" | toString) "create") }}
{{- if or (not $tls.crt) (not $tls.key) }}
{{- fail "controller.tls.crt and controller.tls.key are required when controller.tls.source is create" }}
{{- end }}
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: controller-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iofog-operator.labels" . | nindent 4 }}
data:
  tls.crt: {{ $tls.crt | b64enc }}
  tls.key: {{ $tls.key | b64enc }}
  {{- with $tls.ca }}
  ca.crt: {{ . | b64enc }}
  {{- end }}
{{- end }}
